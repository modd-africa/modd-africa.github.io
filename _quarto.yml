format:
  html:
    theme: theme.scss
    toc: false
    page-layout: article
    grid:
      body-width: 920px
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    include-after-body:
      text: |
        <script>
        (function () {
          const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
          const t = document.querySelectorAll('.fcard,.hubcard,.post,.person,.wp,.card-link,.partners img,.funder,.vision .wrap,.section__lede,section.section h2');
          t.forEach(el => el.classList.add('reveal'));
          if (reduce || !('IntersectionObserver' in window)) { t.forEach(el => el.classList.add('is-visible')); }
          else { const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); } }), {threshold:.12, rootMargin:'0px 0px -8% 0px'}); t.forEach(el => io.observe(el)); }
          const up = el => { const m = el.textContent.trim().match(/^(\d+(?:\.\d+)?)(%?)$/); if(!m) return; const end=parseFloat(m[1]),suf=m[2],dec=m[1].includes('.')?1:0; if(reduce){el.textContent=end.toFixed(dec)+suf;return;} const t0=performance.now(); const tick=t=>{const p=Math.min((t-t0)/1100,1),e=1-Math.pow(1-p,3); el.textContent=(end*e).toFixed(dec)+suf; if(p<1)requestAnimationFrame(tick);}; requestAnimationFrame(tick); };
          const n=document.querySelectorAll('.stat .num');
          if('IntersectionObserver' in window && !reduce){const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){up(e.target);io2.unobserve(e.target);}}),{threshold:.5}); n.forEach(x=>io2.observe(x));} else n.forEach(up);
        })();
        </script>